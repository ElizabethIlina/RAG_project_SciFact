# Явное имя не даёт Compose создавать разные наборы контейнеров при
# переименовании родительской папки.
name: rag-playground

services:
  # Qdrant хранит dense-векторы документов и чанков. Фиксированная версия
  # защищает повторные прогоны от незаметного обновления сервера.
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      # 6333 — HTTP API, 6334 — gRPC API.
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Индекс сохраняется между перезапусками; папка исключена из Git.
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # В образе может не быть curl, поэтому проверяем открытие TCP-порта.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Elasticsearch хранит тексты и выполняет BM25-ранжирование. Конфигурация
  # предназначена только для локальной учебной среды.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      # Один узел достаточен для корпуса из 5 183 документов.
      discovery.type: single-node
      # Security отключена только для localhost; такой режим не подходит для production.
      xpack.security.enabled: "false"
      # Базовой лицензии достаточно для BM25-эксперимента.
      xpack.license.self_generated.type: basic
      # Одинаковые min/max heap упрощают сравнение latency между прогонами.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      # Локальный индекс не пропадает при перезапуске и не коммитится.
      - ./elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      # Cluster health подтверждает, что HTTP API уже готов принимать запросы.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

